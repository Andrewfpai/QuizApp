<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recall">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Recall</title>
<style>
  :root {
    --bg: #0c0d10;
    --surface: #14161b;
    --surface-2: #1b1e25;
    --border: #252932;
    --border-strong: #353a45;
    --text: #e9eaee;
    --muted: #8a8f9b;
    --faint: #5e636e;
    --accent: #8f9dff;
    --accent-soft: rgba(143, 157, 255, .12);
    --good: #5ad19a;
    --good-soft: rgba(90, 209, 154, .11);
    --mid: #f1c56b;
    --bad: #f2777a;
    --bad-soft: rgba(242, 119, 122, .11);
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: dark; background: var(--bg); }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, -apple-system, Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(900px 480px at 50% -200px, rgba(143, 157, 255, .10), transparent 70%);
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  code, pre, textarea.mono { font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  svg { display: block; }

  .app {
    position: relative; max-width: 740px; margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 96px max(20px, env(safe-area-inset-left));
  }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 44px; }
  .top-right { display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; background: none; border: 0; padding: 4px 0; }
  .mark {
    width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, #b3bdff, #6b7aff); color: #0c0d10; font-size: 13px; font-weight: 800;
    box-shadow: 0 6px 20px rgba(107, 122, 255, .28);
  }
  .sync {
    display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12.5px; white-space: nowrap;
  }
  .sync:hover { color: var(--text); border-color: var(--border-strong); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); display: inline-block; flex: none; }
  .dot.good { background: var(--good); }
  .dot.mid { background: var(--mid); }
  .dot.bad { background: var(--bad); }
  .dot.busy { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  h1 { font-size: 34px; line-height: 1.15; letter-spacing: -.025em; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.005em; }
  h3 { font-size: 15px; font-weight: 600; margin: 22px 0 6px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .hero { margin-bottom: 28px; }

  /* buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 15px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--surface-2); font-size: 14px; font-weight: 500; white-space: nowrap;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: #232731; border-color: #434956; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0c0d10; font-weight: 600; }
  .btn.primary:hover { background: #a3afff; border-color: #a3afff; }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #0c0d10; font-weight: 600; }
  .btn.sm { padding: 7px 13px; font-size: 13.5px; }
  .btn-text { background: none; border: 0; padding: 4px 2px; color: var(--muted); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-text:hover { color: var(--text); }
  .icon-btn {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px;
    background: none; border: 1px solid transparent; color: var(--faint); transition: .15s;
  }
  .icon-btn:hover, .icon-btn.on { color: var(--text); background: var(--surface-2); border-color: var(--border); }
  .icon-btn.del:hover { color: var(--bad); }
  .icon-btn svg, .btn-text svg { width: 17px; height: 17px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; }

  /* upload */
  .drop {
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    padding: 38px 20px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius);
    background: rgba(20, 22, 27, .6); cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--accent); margin-bottom: 8px; }
  .drop .ico svg { width: 20px; height: 20px; }
  .drop-title { font-weight: 500; }
  .drop-title .link { color: var(--accent); }
  .drop-sub { color: var(--faint); font-size: 13px; }
  .under-drop { display: flex; justify-content: center; gap: 18px; margin-top: 12px; }

  .paste { margin-top: 14px; }
  .paste textarea {
    width: 100%; min-height: 180px; resize: vertical; padding: 14px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); font-size: 13px; line-height: 1.5; outline: none;
  }
  .paste textarea:focus { border-color: var(--accent); }
  .paste .row { margin-top: 10px; }
  .err { color: var(--bad); font-size: 13.5px; margin-right: auto; white-space: pre-line; }

  /* library */
  .library { margin-top: 44px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
  .count { color: var(--faint); font-weight: 500; margin-left: 6px; }
  .switch { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { appearance: none; -webkit-appearance: none; margin: 0; width: 30px; height: 18px; border-radius: 99px; background: var(--border-strong); position: relative; cursor: pointer; transition: .2s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #cfd2da; transition: .2s; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { left: 14px; background: #0c0d10; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); transition: border-color .15s; }
  .item:hover { border-color: var(--border-strong); }
  .item-row { display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 18px; }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item-actions { display: flex; align-items: center; gap: 4px; }
  .pill { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill.good { color: var(--good); background: var(--good-soft); border-color: transparent; }
  .pill.mid { color: var(--mid); background: rgba(241, 197, 107, .1); border-color: transparent; }
  .pill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }

  .history { border-top: 1px solid var(--border); padding: 8px 10px 10px 18px; }
  .history-row { display: flex; align-items: center; gap: 12px; padding: 5px 0; font-size: 13.5px; }
  .history-row .when { color: var(--muted); flex: 1; }
  .history-row .tag { font-size: 11.5px; color: var(--faint); border: 1px solid var(--border); padding: 1px 7px; border-radius: 99px; margin-left: 6px; }
  .history-row .sc { font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .minibar { width: 80px; height: 4px; border-radius: 4px; background: var(--border); overflow: hidden; }
  .minibar span { display: block; height: 100%; background: var(--accent); }
  .history-row .icon-btn { width: 28px; height: 28px; }
  .history-row .icon-btn svg { width: 14px; height: 14px; }

  .empty { text-align: center; padding: 44px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .empty p { margin-bottom: 14px; }

  /* quiz */
  .quiz-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .quiz-name { flex: 1; text-align: center; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .counter { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; }
  .bar { height: 3px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 36px; }
  .bar span { display: block; height: 100%; background: var(--accent); transition: width .35s ease; }
  .qnum { color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; }
  .qtext { font-size: 22px; line-height: 1.4; font-weight: 500; letter-spacing: -.012em; margin: 0 0 26px; white-space: pre-wrap; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left;
    padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
    transition: border-color .15s, background .15s, opacity .2s;
  }
  .opt:not(:disabled):hover { border-color: #434956; background: var(--surface-2); }
  .opt .key {
    flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px;
    border: 1px solid var(--border-strong); color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: -1px;
  }
  .opt .txt { flex: 1; white-space: pre-wrap; }
  .opt.correct { border-color: var(--good); background: var(--good-soft); }
  .opt.correct .key { background: var(--good); border-color: var(--good); color: #0c0d10; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #0c0d10; }
  .opt.dim { opacity: .45; }

  .short { display: flex; gap: 10px; }
  .short input {
    flex: 1; min-width: 0; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); outline: none; font-size: 15px;
  }
  .short input:focus { border-color: var(--accent); }
  .short input.good { border-color: var(--good); background: var(--good-soft); }
  .short input.bad { border-color: var(--bad); background: var(--bad-soft); }

  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); animation: fade .25s ease; }
  .fb-head { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .feedback.good .fb-head { color: var(--good); }
  .feedback.bad .fb-head { color: var(--bad); }
  .feedback p { color: #c3c6cf; margin-top: 6px; white-space: pre-wrap; }
  .feedback .accepted { margin-top: 6px; color: var(--muted); }
  .feedback .accepted b { color: var(--text); font-weight: 600; }
  .feedback .btn-text { margin-top: 6px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

  .quiz-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; min-height: 40px; gap: 12px; }
  .hint { color: var(--faint); font-size: 12.5px; }
  .hint kbd { font-family: inherit; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11.5px; color: var(--muted); }
  .tally { color: var(--faint); font-size: 12.5px; display: none; }

  /* results */
  .result-head { display: flex; align-items: center; gap: 28px; margin-bottom: 30px; }
  .ring { position: relative; width: 132px; height: 132px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .result-head h1 { font-size: 30px; }
  .result-head .row { margin-top: 18px; }
  .review { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .rev { display: flex; gap: 14px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .rev-mark { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #0c0d10; margin-top: 1px; }
  .rev.ok .rev-mark { background: var(--good); }
  .rev.no .rev-mark { background: var(--bad); }
  .rev-q { white-space: pre-wrap; }
  .rev-a { margin-top: 5px; font-size: 13.5px; display: flex; flex-direction: column; gap: 2px; }
  .rev-a .good { color: var(--good); }
  .rev-a .bad { color: var(--bad); }
  .rev-a .exp { color: var(--muted); margin-top: 3px; white-space: pre-wrap; }

  /* modal & toast */
  .overlay { position: fixed; inset: 0; background: rgba(5, 6, 8, .66); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: grid; place-items: center; padding: 20px; z-index: 50; animation: fadeIn .15s ease; }
  .modal { width: 100%; max-width: 580px; max-height: 86vh; overflow: auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px; padding: 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); animation: pop .18s ease; }
  .modal.sm { max-width: 400px; }
  .modal h2 { font-size: 18px; margin-bottom: 6px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .modal .row.end { margin-top: 22px; }
  pre.code { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 12.5px; line-height: 1.55; overflow: auto; margin: 10px 0 0; color: #c9ccd6; white-space: pre-wrap; max-height: 300px; }
  .rules { padding-left: 18px; margin: 12px 0 0; color: #c3c6cf; font-size: 14px; }
  .rules li { margin: 5px 0; }
  code { font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); padding: 0 5px; border-radius: 5px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .field input { padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); outline: none; font-size: 15px; color: var(--text); }
  .field input:focus { border-color: var(--accent); }
  form .err { margin-top: 12px; }
  .acct-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .acct-row b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .acct-row .dot { margin-right: 6px; }
  #accountBody > .err { margin-top: 12px; }

  .toasts { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: max-content; max-width: calc(100% - 32px); }
  .toast { background: #20232b; border: 1px solid var(--border-strong); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); animation: pop .18s ease; white-space: pre-line; }
  .toast.bad { border-color: rgba(242, 119, 122, .5); color: #ffb3b4; }

  .fade { animation: fade .28s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }

  @media (max-width: 560px) {
    header.top { margin-bottom: 32px; }
    h1 { font-size: 28px; }
    .hide-sm { display: none; }
    .drop { padding: 30px 16px; }
    .item-row { flex-wrap: wrap; }
    .item-main { flex-basis: calc(100% - 80px); }
    .item-actions { width: 100%; justify-content: flex-end; }
    .qtext { font-size: 19px; margin-bottom: 22px; }
    .result-head { flex-direction: column; align-items: flex-start; }
    .hint, .minibar { display: none; }
    .tally { display: inline; }
    /* 16px stops iOS from zooming in when a field is focused */
    .short input, .field input, .paste textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" data-act="home"><span class="mark">R</span>Recall</button>
    <div class="top-right">
      <button class="sync" id="syncBtn" data-act="account" title="Sync & account"></button>
      <button class="btn-text" data-act="guide" title="Format & prompt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17h.01"/></svg>
        <span class="hide-sm">Format &amp; prompt</span>
      </button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts"></div>

<script src="config.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const LETTERS = 'ABCDEFGHIJ';

const ICON = {
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>',
  paste: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>',
};

/* ---------- local store ----------
   Everything is kept as flat records ({id, kind: 'quiz' | 'attempt', data, updatedAt, deleted, dirty})
   so each one can sync on its own. Deletes leave a tombstone so they reach other devices. */
const KEY = 'recall.v2';
const rec = (kind, id, data) => ({ id, kind, data, updatedAt: Date.now(), deleted: false, dirty: true });

function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.records) return { settings: { shuffle: false }, cursor: null, lastSyncedAt: null, ...s };
  } catch {}
  const s = { records: {}, settings: { shuffle: false }, cursor: null, lastSyncedAt: null };
  try { // carry over quizzes saved by the first version of the app
    const old = JSON.parse(localStorage.getItem('recall.v1'));
    for (const q of old?.quizzes || []) {
      s.records[q.id] = rec('quiz', q.id, { title: q.title, createdAt: q.createdAt, questions: q.questions });
      for (const a of q.attempts || []) { const id = uid(); s.records[id] = rec('attempt', id, { quizId: q.id, ...a }); }
    }
    if (old?.settings) s.settings = old.settings;
  } catch {}
  return s;
}
function saveStore() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch { toast('Could not save — browser storage may be full or blocked.', 'bad'); }
}
let store = loadStore();

function put(kind, id, data) {
  const prev = store.records[id];
  store.records[id] = { ...rec(kind, id, data), updatedAt: Math.max(Date.now(), (prev?.updatedAt || 0) + 1) };
  saveStore();
  scheduleSync();
}
function removeAll(ids) {
  for (const id of ids) {
    const r = store.records[id];
    if (r) Object.assign(r, { data: null, deleted: true, dirty: true, updatedAt: Math.max(Date.now(), r.updatedAt + 1) });
  }
  saveStore();
  scheduleSync();
}
const live = kind => Object.values(store.records).filter(r => r.kind === kind && !r.deleted);
const getQuiz = id => { const r = store.records[id]; return r && r.kind === 'quiz' && !r.deleted ? { id, ...r.data } : null; };
const allQuizzes = () => live('quiz').map(r => ({ id: r.id, ...r.data })).sort((a, b) => b.createdAt - a.createdAt);
const attemptsOf = qid => live('attempt').filter(r => r.data.quizId === qid).map(r => ({ id: r.id, ...r.data })).sort((a, b) => a.at - b.at);
const pendingCount = () => Object.values(store.records).filter(r => r.dirty).length;

/* ---------- cloud sync (Firebase Auth + Firestore, through their REST APIs) ----------
   Each record is a Firestore document at users/{uid}/items/{id}. The security rules only accept a
   change whose updatedAt is newer than the stored one, and stamp syncedAt with the server time,
   which is what devices pull by. */
const CFG = window.RECALL_CONFIG || {};
const API_KEY = (CFG.firebaseApiKey || '').trim();
const PROJECT = (CFG.firebaseProjectId || '').trim();
const cloudOn = !!(API_KEY && PROJECT);
const HOSTS = { // `hosts` in config.js is only for testing against a local stand-in
  auth: 'https://identitytoolkit.googleapis.com',
  token: 'https://securetoken.googleapis.com',
  firestore: 'https://firestore.googleapis.com',
  ...CFG.hosts,
};
const DOCS = `projects/${PROJECT}/databases/(default)/documents`;
const AUTH_KEY = 'recall.firebase-auth';
let auth = (() => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; } })();
let syncStatus = 'idle', syncError = '', syncTimer = null, syncing = null, syncAgain = false, refreshing = null;

function setAuth(a) {
  auth = a;
  try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch {}
  renderStatus();
}
// Sign-in and token-refresh responses use different field names
const sessionFrom = (j, email) => ({
  token: j.idToken || j.id_token,
  refresh: j.refreshToken || j.refresh_token,
  expiresAt: Math.floor(Date.now() / 1000) + Number(j.expiresIn || j.expires_in || 3600),
  user: { id: j.localId || j.user_id, email: j.email || email },
});

const AUTH_ERRORS = {
  EMAIL_EXISTS: 'An account with this email already exists. Sign in instead.',
  INVALID_LOGIN_CREDENTIALS: 'Wrong email or password.',
  INVALID_PASSWORD: 'Wrong email or password.',
  EMAIL_NOT_FOUND: 'Wrong email or password.',
  INVALID_EMAIL: 'That email address isn’t valid.',
  WEAK_PASSWORD: 'Use a password with at least 6 characters.',
  TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many attempts. Try again in a few minutes.',
  USER_DISABLED: 'This account has been disabled.',
  OPERATION_NOT_ALLOWED: 'Email sign-in isn’t turned on in Firebase yet (see SETUP.md).',
  ADMIN_ONLY_OPERATION: 'New sign-ups are turned off for this app.',
};

async function cloudFetch(url, { method = 'GET', body, form, token } = {}) {
  const headers = { 'Content-Type': form ? 'application/x-www-form-urlencoded' : 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(url, { method, headers, body: form ? new URLSearchParams(form) : body === undefined ? undefined : JSON.stringify(body) });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch {}
  if (!res.ok) {
    const msg = String((Array.isArray(json) ? json[0] : json)?.error?.message || `Request failed (${res.status})`);
    const err = new Error(AUTH_ERRORS[msg.split(' ')[0]] || msg);
    err.status = res.status;
    throw err;
  }
  return json;
}

async function accessToken() {
  if (!auth) throw Object.assign(new Error('Not signed in'), { status: 401 });
  if (auth.expiresAt - 60 > Date.now() / 1000) return auth.token;
  refreshing ||= cloudFetch(`${HOSTS.token}/v1/token?key=${API_KEY}`, { method: 'POST', form: { grant_type: 'refresh_token', refresh_token: auth.refresh } })
    .then(j => setAuth(sessionFrom(j, auth?.user.email)))
    .catch(err => { if (err.status >= 400 && err.status < 500) setAuth(null); throw err; }) // network errors keep you signed in
    .finally(() => { refreshing = null; });
  await refreshing;
  return auth.token;
}
async function api(url, opts = {}) {
  try { return await cloudFetch(url, { ...opts, token: await accessToken() }); }
  catch (err) {
    if (err.status !== 401 || !auth) throw err;
    auth.expiresAt = 0; // token rejected: refresh once and retry
    return cloudFetch(url, { ...opts, token: await accessToken() });
  }
}

async function signIn(email, password, create) {
  const j = await cloudFetch(`${HOSTS.auth}/v1/accounts:${create ? 'signUp' : 'signInWithPassword'}?key=${API_KEY}`,
    { method: 'POST', body: { email, password, returnSecureToken: true } });
  store.cursor = null;
  saveStore();
  setAuth(sessionFrom(j));
  sync();
}
function signOut() {
  store.cursor = null;
  saveStore();
  setAuth(null);
}

const toWrite = r => ({
  update: {
    name: `${DOCS}/users/${auth.user.id}/items/${r.id}`,
    fields: {
      kind: { stringValue: r.kind },
      data: r.data == null ? { nullValue: null } : { stringValue: JSON.stringify(r.data) },
      updatedAt: { integerValue: String(r.updatedAt) },
      deleted: { booleanValue: !!r.deleted },
    },
  },
  updateTransforms: [{ fieldPath: 'syncedAt', setToServerValue: 'REQUEST_TIME' }],
});
const fromDoc = d => ({
  id: d.name.split('/').pop(),
  kind: d.fields.kind.stringValue,
  data: d.fields.data?.stringValue ? JSON.parse(d.fields.data.stringValue) : null,
  updated_at: Number(d.fields.updatedAt.integerValue),
  deleted: !!d.fields.deleted?.booleanValue,
});
function pullQuery(since, after) {
  const q = {
    from: [{ collectionId: 'items' }],
    orderBy: [{ field: { fieldPath: 'syncedAt' }, direction: 'ASCENDING' }, { field: { fieldPath: '__name__' }, direction: 'ASCENDING' }],
    limit: 500,
  };
  if (since) q.where = { fieldFilter: { field: { fieldPath: 'syncedAt' }, op: 'GREATER_THAN', value: { timestampValue: since } } };
  if (after) q.startAt = { values: [{ timestampValue: after.ts }, { referenceValue: after.name }], before: false };
  return { structuredQuery: q };
}

function scheduleSync(ms = 800) {
  renderStatus();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, ms);
}

async function sync() {
  if (!cloudOn || !auth) return renderStatus();
  if (!navigator.onLine) return setSync('offline');
  if (syncing) { syncAgain = true; return syncing; }
  syncing = (async () => {
    setSync('syncing');
    try {
      // 1. push local changes; each write succeeds or fails on its own
      const sent = Object.values(store.records).filter(r => r.dirty).map(r => ({ ...r }));
      for (let i = 0; i < sent.length; i += 400) {
        const chunk = sent.slice(i, i + 400);
        const res = await api(`${HOSTS.firestore}/v1/${DOCS}:batchWrite`, { method: 'POST', body: { writes: chunk.map(toWrite) } });
        chunk.forEach((s, k) => {
          // 0 = saved; 7 = refused because the server already has a newer version, which the pull below fetches
          const code = res?.status?.[k]?.code || 0, cur = store.records[s.id];
          if ((code === 0 || code === 7) && cur && cur.updatedAt === s.updatedAt) cur.dirty = false;
        });
        saveStore();
      }
      // 2. pull everything changed on the server since the last pull. Look back a few seconds
      //    so writes that committed late aren't missed; re-reading a record is harmless.
      let changed = false, cursor = store.cursor, after = null;
      const since = cursor ? new Date(Date.parse(cursor.replace(/(\.\d{3})\d+/, '$1')) - 10000).toISOString() : null;
      for (;;) {
        const res = await api(`${HOSTS.firestore}/v1/${DOCS}/users/${auth.user.id}:runQuery`, { method: 'POST', body: pullQuery(since, after) });
        const docs = (res || []).filter(x => x.document).map(x => x.document);
        for (const d of docs) changed = mergeRow(fromDoc(d)) || changed;
        if (docs.length) {
          const last = docs[docs.length - 1];
          cursor = last.fields.syncedAt.timestampValue;
          after = { ts: cursor, name: last.name };
        }
        if (docs.length < 500) break;
      }
      store.cursor = cursor;
      store.lastSyncedAt = Date.now();
      saveStore();
      setSync('synced');
      if (changed && view === 'home') renderLibrary();
    } catch (err) {
      if (!err.status) setSync('offline'); // fetch itself failed: no connection
      else setSync('error', err.message);
    }
  })();
  try { await syncing; }
  finally {
    syncing = null;
    if (syncAgain) { syncAgain = false; scheduleSync(0); }
  }
}

function mergeRow(row) {
  const local = store.records[row.id], updatedAt = Number(row.updated_at);
  if (local && local.updatedAt >= updatedAt) return false;
  store.records[row.id] = { id: row.id, kind: row.kind, data: row.data, updatedAt, deleted: row.deleted, dirty: false };
  return true;
}

function setSync(s, err = '') { syncStatus = s; syncError = err; renderStatus(); }
function statusInfo() {
  if (!cloudOn) return { cls: '', label: 'Local only' };
  if (!auth) return { cls: '', label: 'Sign in to sync' };
  const p = pendingCount();
  if (!navigator.onLine || syncStatus === 'offline') return { cls: 'mid', label: p ? `Offline · ${p} to sync` : 'Offline' };
  if (syncStatus === 'syncing') return { cls: 'busy', label: 'Syncing' };
  if (syncStatus === 'error') return { cls: 'bad', label: 'Sync error' };
  if (p) return { cls: 'mid', label: `${p} to sync` };
  return { cls: 'good', label: 'Synced' };
}
function renderStatus() {
  const { cls, label } = statusInfo();
  $('#syncBtn').innerHTML = `<span class="dot ${cls}"></span><span>${label}</span>`;
  renderAccount();
}

window.addEventListener('online', () => sync());
window.addEventListener('offline', () => renderStatus());
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => { if (!document.hidden) sync(); }, 60000);

/* ---------- parsing ---------- */
const pick = (o, keys) => { for (const k of keys) if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k]; };

function parseQuizText(text, fallbackTitle) {
  let t = String(text).replace(/^﻿/, '').trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  let data;
  try { data = JSON.parse(t); }
  catch (err) {
    // Tolerate text around the JSON (e.g. a whole LLM reply pasted in)
    const starts = ['{', '['].map(c => t.indexOf(c)).filter(i => i >= 0);
    const s = Math.min(...starts), e = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
    if (starts.length && e > s) { try { data = JSON.parse(t.slice(s, e + 1)); } catch {} }
    if (data === undefined) throw new Error('That isn’t valid JSON — ' + err.message);
  }
  let title = fallbackTitle, list;
  if (Array.isArray(data)) list = data;
  else if (data && typeof data === 'object') {
    title = data.title || data.name || data.topic || fallbackTitle;
    list = data.questions || data.quiz || data.items;
    if (list && !Array.isArray(list) && typeof list === 'object') { title = list.title || title; list = list.questions; }
  }
  if (!Array.isArray(list) || !list.length) throw new Error('No questions found — expected a "questions" array.');
  return { title: String(title || 'Untitled quiz').trim(), questions: list.map(normalizeQuestion) };
}

function normalizeQuestion(raw, i) {
  const n = i + 1;
  if (!raw || typeof raw !== 'object') throw new Error(`Question ${n} isn’t an object.`);
  const question = pick(raw, ['question', 'q', 'prompt', 'text']);
  if (!question) throw new Error(`Question ${n} has no "question" text.`);
  let options = pick(raw, ['options', 'choices']);
  const answer = pick(raw, ['answer', 'correct', 'correctAnswer', 'correct_answer', 'answerIndex', 'answer_index']);
  const explanation = String(pick(raw, ['explanation', 'explain', 'reason', 'rationale']) ?? '');
  if (answer === undefined) throw new Error(`Question ${n} has no "answer".`);
  if (options && !Array.isArray(options) && typeof options === 'object') options = Object.values(options);

  if (Array.isArray(options) && options.length) {
    options = stripLetterPrefixes(options.map(o => String(o && typeof o === 'object' ? (o.text ?? o.label ?? JSON.stringify(o)) : o)));
    const correct = resolveAnswer(answer, options);
    if (correct < 0) throw new Error(`Question ${n}: couldn’t match answer "${answer}" to an option.`);
    return { type: 'mc', question: String(question), options, correct, explanation };
  }
  if (typeof answer === 'boolean' || /^(true|false)$/i.test(String(answer).trim())) {
    return { type: 'mc', question: String(question), options: ['True', 'False'], correct: String(answer).trim().toLowerCase() === 'true' ? 0 : 1, explanation };
  }
  const accepted = (Array.isArray(answer) ? answer : [answer]).map(String).filter(s => s.trim());
  if (!accepted.length) throw new Error(`Question ${n} has an empty answer.`);
  return { type: 'short', question: String(question), accepted, explanation };
}

function stripLetterPrefixes(opts) {
  const re = i => new RegExp(`^\\(?${LETTERS[i]}[).:]\\s+`, 'i');
  return opts.length > 1 && opts.every((o, i) => re(i).test(o)) ? opts.map((o, i) => o.replace(re(i), '')) : opts;
}

function resolveAnswer(ans, options) {
  const fromNumber = n => Number.isInteger(n) && n >= 0 && n < options.length ? n : (n === options.length ? n - 1 : -1);
  if (Array.isArray(ans)) ans = ans[0];
  if (typeof ans === 'number') return fromNumber(ans);
  const s = String(ans).trim(), lower = s.toLowerCase();
  let i = options.findIndex(o => o.trim().toLowerCase() === lower);
  if (i >= 0) return i;
  const m = s.match(/^\(?([A-J])\)?$/i) || s.match(/^\(?([A-J])[).:]\s/i) || s.match(/^option\s+([A-J])$/i);
  if (m) { const k = LETTERS.indexOf(m[1].toUpperCase()); if (k < options.length) return k; }
  if (/^\d+$/.test(s)) return fromNumber(+s);
  return options.findIndex(o => o.trim().length > 2 && lower.endsWith(o.trim().toLowerCase()));
}

function addQuizFromText(text, fallbackTitle) {
  const { title, questions } = parseQuizText(text, fallbackTitle);
  const id = uid();
  put('quiz', id, { title, createdAt: Date.now(), questions });
  return id;
}

/* ---------- helpers ---------- */
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const tone = p => p >= 80 ? 'good' : p >= 50 ? 'mid' : 'bad';
function fmtDate(ts, withTime) {
  const d = new Date(ts), now = new Date();
  const opts = { month: 'short', day: 'numeric' };
  if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
  if (withTime) { opts.hour = 'numeric'; opts.minute = '2-digit'; }
  return d.toLocaleString(undefined, opts);
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const norm = s => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
  .replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/^(the|a|an) /, '');

function toast(msg, kind = '', ms = 2600) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), ms);
}

let modalResolve = null;
function openModal(html, cls = '') {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(false); });
  document.body.append(ov);
  return ov;
}
function closeModal(result) {
  document.querySelector('.overlay')?.remove();
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(!!result); }
}
function confirmDialog(title, body, okLabel = 'Confirm') {
  return new Promise(res => {
    const ov = openModal(`<h2>${esc(title)}</h2><p class="muted">${esc(body)}</p>
      <div class="row end"><button class="btn" data-m="no">Cancel</button><button class="btn danger" data-m="yes">${esc(okLabel)}</button></div>`, 'sm');
    modalResolve = res;
    ov.querySelector('[data-m="no"]').onclick = () => closeModal(false);
    ov.querySelector('[data-m="yes"]').onclick = () => closeModal(true);
    ov.querySelector('[data-m="yes"]').focus();
  });
}

/* ---------- account ---------- */
function openAccount() {
  openModal(`<div class="modal-head"><h2>Sync</h2><button class="icon-btn" data-m="close">${ICON.x}</button></div><div id="accountBody"></div>`, 'sm');
  $('.overlay [data-m="close"]').onclick = () => closeModal();
  renderAccount();
}

function renderAccount() {
  const el = $('#accountBody');
  if (!el) return;
  const mode = !cloudOn ? 'off' : !auth ? 'form' : 'in';
  if (mode === 'form' && el.dataset.mode === 'form') return; // don't wipe what's being typed
  el.dataset.mode = mode;

  if (mode === 'off') {
    el.innerHTML = `<p class="muted">Sync isn’t set up yet, so quizzes are saved on this device only.</p>
      <p class="muted" style="margin-top:10px">To sync your phone and computer, add your Firebase API key and project ID to <code>config.js</code>. The steps are in <code>SETUP.md</code>.</p>`;
    return;
  }
  if (mode === 'form') {
    el.innerHTML = `<p class="muted">Sign in to back up your quizzes and history, and keep your devices in sync.</p>
      <form id="authForm">
        <label class="field">Email<input name="email" type="email" autocomplete="email" required></label>
        <label class="field">Password<input name="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <p id="authMsg"></p>
        <div class="row end"><button type="button" class="btn" data-m="signup">Create account</button><button class="btn primary" type="submit">Sign in</button></div>
      </form>`;
    const form = $('#authForm'), msg = $('#authMsg');
    const go = async create => {
      if (!form.reportValidity()) return;
      const { email, password } = Object.fromEntries(new FormData(form));
      msg.className = ''; msg.textContent = '';
      form.querySelectorAll('button').forEach(b => { b.disabled = true; });
      try {
        await signIn(email.trim(), password, create);
      } catch (err) {
        msg.className = 'err';
        msg.textContent = err.status ? err.message : 'Can’t reach the server. Are you online?';
      } finally {
        form.querySelectorAll('button').forEach(b => { b.disabled = false; });
      }
    };
    form.onsubmit = e => { e.preventDefault(); go(false); };
    form.querySelector('[data-m="signup"]').onclick = () => go(true);
    return;
  }
  const { cls, label } = statusInfo();
  el.innerHTML = `
    <div class="acct-row"><span class="muted">Signed in as</span><b>${esc(auth.user.email || '')}</b></div>
    <div class="acct-row"><span class="muted">Status</span><span><span class="dot ${cls}"></span>${label}</span></div>
    <div class="acct-row"><span class="muted">Last synced</span><span>${store.lastSyncedAt ? fmtDate(store.lastSyncedAt, true) : 'Never'}</span></div>
    ${syncStatus === 'error' && syncError ? `<p class="err">${esc(syncError)}</p>` : ''}
    <div class="row end"><button class="btn" data-m="signout">Sign out</button><button class="btn primary" data-m="syncnow" ${syncStatus === 'syncing' ? 'disabled' : ''}>Sync now</button></div>`;
  el.querySelector('[data-m="syncnow"]').onclick = () => sync();
  el.querySelector('[data-m="signout"]').onclick = () => { signOut(); toast('Signed out. Your quizzes stay on this device.'); };
}

function quizItem(q) {
  const attempts = attemptsOf(q.id);
  const full = attempts.filter(a => a.mode !== 'mistakes');
  const best = full.length ? Math.max(...full.map(a => pct(a.score, a.total))) : null;
  const n = attempts.length, open = openHistory.has(q.id) && n;
  const pill = best !== null ? `<span class="pill ${tone(best)}" title="Best score">${best}%</span>`
    : n ? '' : '<span class="pill">New</span>';
  return `
    <article class="item" data-id="${q.id}">
      <div class="item-row">
        <div class="item-main">
          <div class="item-title" title="${esc(q.title)}">${esc(q.title)}</div>
          <div class="item-meta">${q.questions.length} question${q.questions.length === 1 ? '' : 's'} · Added ${fmtDate(q.createdAt)}${n ? ` · ${n} attempt${n === 1 ? '' : 's'}` : ''}</div>
        </div>
        ${pill}
        <div class="item-actions">
          ${n ? `<button class="icon-btn ${open ? 'on' : ''}" data-act="history" title="History">${ICON.clock}</button>` : ''}
          <button class="icon-btn del" data-act="delete" title="Delete quiz">${ICON.trash}</button>
          <button class="btn primary sm" data-act="start">Start</button>
        </div>
      </div>
      ${open ? historyHtml(attempts) : ''}
    </article>`;
}

function historyHtml(attempts) {
  return `<div class="history">${[...attempts].reverse().map(a => {
    const p = pct(a.score, a.total);
    return `<div class="history-row">
      <span class="when">${fmtDate(a.at, true)}${a.mode === 'mistakes' ? '<span class="tag">Mistakes</span>' : ''}</span>
      <span class="minibar"><span style="width:${p}%"></span></span>
      <span class="sc">${a.score}/${a.total}</span>
      <span class="pill ${tone(p)}">${p}%</span>
      <button class="icon-btn del" data-act="del-attempt" data-aid="${a.id}" title="Remove this attempt">${ICON.x}</button>
    </div>`;
  }).join('')}</div>`;
}

async function handleFiles(files) {
  const added = [], errs = [];
  for (const f of files) {
    try { added.push(addQuizFromText(await f.text(), f.name.replace(/\.json$/i, ''))); }
    catch (err) { errs.push(`${f.name}: ${err.message}`); }
  }
  if (errs.length) toast(errs.join('\n'), 'bad', 7000);
  if (added.length === 1) { toast('Saved to library'); startQuiz(added[0]); }
  else { renderLibrary(); if (added.length) toast(`${added.length} quizzes added`); }
}

/* ---------- quiz ---------- */
function startQuiz(id, only) {
  const quiz = getQuiz(id);
  if (!quiz) return renderHome();
  const order = only ? [...only] : quiz.questions.map((_, i) => i);
  if (store.settings.shuffle) shuffle(order);
  session = { quizId: id, order, pos: 0, results: [], mode: only ? 'mistakes' : 'all' };
  view = 'quiz';
  renderQuestion();
  window.scrollTo(0, 0);
}

const currentQuiz = () => session && getQuiz(session.quizId);
const currentQ = () => currentQuiz().questions[session.order[session.pos]];

function renderQuestion() {
  const quiz = currentQuiz();
  if (!quiz) { toast('This quiz was deleted on another device.'); return renderHome(); }
  const q = currentQ(), { pos, order, results } = session;
  const r = results[pos], total = order.length;
  const fresh = session.shown !== pos; // only animate when a new question appears, not after answering
  session.shown = pos;
  const correctSoFar = results.filter(x => x?.correct).length;

  let body;
  if (q.type === 'mc') {
    body = `<div class="options">${q.options.map((o, i) => {
      let cls = '';
      if (r) cls = i === q.correct ? 'correct' : i === r.given ? 'wrong' : 'dim';
      return `<button class="opt ${cls}" data-act="pick" data-i="${i}" ${r ? 'disabled' : ''}><span class="key">${LETTERS[i] || i + 1}</span><span class="txt">${esc(o)}</span></button>`;
    }).join('')}</div>`;
  } else {
    body = `<div class="short">
      <input id="shortInput" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" enterkeyhint="done" ${r ? `disabled value="${esc(r.given)}" class="${r.correct ? 'good' : 'bad'}"` : ''}>
      ${r ? '' : '<button class="btn primary" data-act="check">Check</button>'}
    </div>`;
  }

  let feedback = '';
  if (r) {
    feedback = `<div class="feedback ${r.correct ? 'good' : 'bad'}">
      <div class="fb-head">${r.correct ? 'Correct' : 'Not quite'}</div>
      ${q.type === 'short' && !r.correct ? `<div class="accepted">Answer: <b>${esc(q.accepted.join(' / '))}</b></div>` : ''}
      ${q.explanation ? `<p>${esc(q.explanation)}</p>` : ''}
      ${q.type === 'short' && !r.correct ? '<button class="btn-text" data-act="override">I was right — count it</button>' : ''}
    </div>`;
  }

  const last = pos === total - 1;
  main.innerHTML = `
    <div class="quiz-top">
      <button class="btn-text" data-act="exit">${ICON.back} Exit</button>
      <div class="quiz-name">${esc(quiz.title)}${session.mode === 'mistakes' ? ' · Mistakes' : ''}</div>
      <div class="counter">${pos + 1} / ${total}</div>
    </div>
    <div class="bar"><span style="width:${pct(results.filter(Boolean).length, total)}%"></span></div>
    <div class="${fresh ? 'fade' : ''}">
      <div class="qnum">Question ${pos + 1}</div>
      <h2 class="qtext">${esc(q.question)}</h2>
      ${body}
      ${feedback}
    </div>
    <div class="quiz-foot">
      <span class="hint">${r ? '<kbd>Enter</kbd> to continue' : q.type === 'mc' ? `<kbd>1</kbd>–<kbd>${q.options.length}</kbd> or <kbd>A</kbd>–<kbd>${LETTERS[q.options.length - 1]}</kbd> to answer` : '<kbd>Enter</kbd> to check'} · ${correctSoFar} correct</span>
      <span class="tally">${correctSoFar} correct</span>
      ${r ? `<button class="btn primary" data-act="next">${last ? 'See results' : 'Next'}</button>` : ''}
    </div>`;

  if (q.type === 'short' && !r) $('#shortInput').focus();
}

function record(given, correct) {
  session.results[session.pos] = { qi: session.order[session.pos], given, correct };
  renderQuestion();
}
function pickOption(i) { record(i, i === currentQ().correct); }
function checkShort() {
  const inp = $('#shortInput'), val = inp.value.trim();
  if (!val) return inp.focus();
  record(val, currentQ().accepted.some(a => norm(a) === norm(val)));
}
function next() {
  if (session.pos < session.order.length - 1) { session.pos++; renderQuestion(); window.scrollTo(0, 0); }
  else finish();
}
async function exitQuiz() {
  if (session.results.some(Boolean) && !(await confirmDialog('Leave this quiz?', 'This attempt won’t be saved to your history.', 'Leave'))) return;
  renderHome();
}

function finish() {
  const { results, mode, quizId } = session;
  if (!currentQuiz()) return renderHome();
  put('attempt', uid(), { quizId, at: Date.now(), score: results.filter(r => r.correct).length, total: results.length, mode });
  renderResults();
}

function renderResults() {
  view = 'results';
  const quiz = currentQuiz(), { results } = session;
  const score = results.filter(r => r.correct).length, total = results.length, p = pct(score, total);
  const wrong = results.filter(r => !r.correct).length;
  const C = 2 * Math.PI * 56;
  const color = p >= 80 ? 'var(--good)' : p >= 50 ? 'var(--mid)' : 'var(--bad)';
  const msg = p === 100 ? 'Perfect score.' : p >= 80 ? 'Great work.' : p >= 50 ? 'Getting there.' : 'Keep practicing.';

  main.innerHTML = `
    <div class="fade">
      <div class="quiz-top"><button class="btn-text" data-act="home">${ICON.back} Library</button><div class="quiz-name">${esc(quiz.title)}</div><div class="counter"></div></div>
      <div class="bar"><span style="width:100%"></span></div>
      <div class="result-head">
        <div class="ring">
          <svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--border)" stroke-width="9"/>
          <circle id="ringArc" cx="66" cy="66" r="56" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"/></svg>
          <div class="val">${p}%</div>
        </div>
        <div>
          <h1>${msg}</h1>
          <p class="muted">${score} of ${total} correct${session.mode === 'mistakes' ? ' · mistakes round' : ''}</p>
          <div class="row">
            ${wrong ? `<button class="btn primary" data-act="retry-wrong">Practice ${wrong} mistake${wrong === 1 ? '' : 's'}</button>` : ''}
            <button class="btn ${wrong ? '' : 'primary'}" data-act="retry">Retry all</button>
            <button class="btn" data-act="home">Library</button>
          </div>
        </div>
      </div>
      <div class="section-head"><h2>Review</h2></div>
      <ol class="review">${results.map(r => reviewItem(quiz.questions[r.qi], r)).join('')}</ol>
    </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { $('#ringArc').style.strokeDashoffset = C * (1 - p / 100); }));
  window.scrollTo(0, 0);
}

function reviewItem(q, r) {
  const show = v => q.type === 'mc' ? q.options[v] : v;
  const right = q.type === 'mc' ? q.options[q.correct] : q.accepted[0];
  return `<li class="rev ${r.correct ? 'ok' : 'no'}">
    <span class="rev-mark">${r.correct ? '✓' : '✕'}</span>
    <div>
      <div class="rev-q">${esc(q.question)}</div>
      <div class="rev-a">
        ${r.correct ? `<span class="good">${esc(show(r.given))}</span>` : `<span class="bad">Your answer: ${esc(show(r.given))}</span><span class="good">Correct: ${esc(right)}</span>`}
        ${!r.correct && q.explanation ? `<span class="exp">${esc(q.explanation)}</span>` : ''}
      </div>
    </div>
  </li>`;
}

/* ---------- guide ---------- */
// Keep in sync with LLM-PROMPT.txt
const PROMPT = `Create a practice quiz for my quiz app.

Topic: [TOPIC]
Number of questions: [NUMBER]
Difficulty: [easy / medium / hard]
Source material (optional): [paste notes here, or delete this line]

Reply with a single \`\`\`json code block containing ONLY valid JSON (no comments, no trailing commas), in exactly this structure:

{
  "title": "Short quiz title",
  "questions": [
    {
      "question": "A multiple-choice question?",
      "options": ["First option", "Second option", "Third option", "Fourth option"],
      "answer": "B",
      "explanation": "Why the correct answer is right, in 1-2 sentences."
    },
    {
      "question": "A true or false statement.",
      "answer": true,
      "explanation": "Why it is true or false."
    },
    {
      "question": "A question I answer by typing a short word or phrase?",
      "answer": ["main answer", "another accepted spelling"],
      "explanation": "Short explanation."
    }
  ]
}

Rules:
1. Multiple choice: 2-6 "options"; "answer" is the LETTER of the correct option (A = first, B = second, ...). Spread the correct letter across A-D.
2. Never start an option with a label such as "A)" or "1.".
3. True/false: leave out "options"; "answer" is the boolean true or false (no quotes).
4. Typed answer: leave out "options"; "answer" is a list of short accepted answers (1-3 words each).
5. Every question has an "explanation".
6. Use mostly multiple choice unless I ask for something else.
7. Escape double quotes inside text as \\".`;

const SAMPLE = {
  title: 'Sample: The Solar System',
  questions: [
    { question: 'Which planet is closest to the Sun?', options: ['Venus', 'Mercury', 'Earth', 'Mars'], answer: 'B', explanation: 'Mercury orbits closest, at about 58 million km on average.' },
    { question: 'Which planet is known as the Red Planet?', options: ['Jupiter', 'Venus', 'Mars', 'Saturn'], answer: 'C', explanation: 'Iron oxide (rust) in its soil gives Mars its reddish colour.' },
    { question: 'The Sun is a star.', answer: true, explanation: 'The Sun is a G-type main-sequence star — a fairly ordinary one.' },
    { question: 'What force keeps the planets in orbit around the Sun?', answer: ['gravity', 'gravitation'], explanation: 'The Sun’s gravity constantly pulls the planets toward it while their motion carries them sideways.' },
    { question: 'Which is the largest planet in the Solar System?', options: ['Earth', 'Saturn', 'Jupiter', 'Neptune'], answer: 'Jupiter', explanation: 'Jupiter has more than twice the mass of all the other planets combined.' },
    { question: 'Sunlight takes about how long to reach Earth?', options: ['8 seconds', '8 minutes', '8 hours', '8 days'], answer: 'B', explanation: 'About 8 minutes 20 seconds to cover roughly 150 million km.' },
  ],
};

function openGuide() {
  openModal(`
    <div class="modal-head"><h2>Prompt for your AI</h2><button class="icon-btn" data-m="close">${ICON.x}</button></div>
    <p class="muted">Copy this into Claude, ChatGPT, Gemini or any other AI chat. Fill in the topic, then paste its reply here.</p>
    <pre class="code">${esc(PROMPT)}</pre>
    <div class="row end">
      <button class="btn" data-m="sample">Try sample quiz</button>
      <button class="btn primary" data-m="copy">Copy prompt</button>
    </div>
    <h3>What the app accepts</h3>
    <ul class="rules">
      <li><b>Multiple choice</b>: give <code>options</code>; <code>answer</code> is the letter (<code>"B"</code>), the option text, or a 0-based index.</li>
      <li><b>True / false</b>: no options; <code>answer</code> is <code>true</code> or <code>false</code>.</li>
      <li><b>Typed answer</b>: no options; <code>answer</code> is the expected text, or a list of accepted answers.</li>
      <li><code>explanation</code> is optional and shows after you answer.</li>
      <li>Extra text around the JSON, like the AI’s intro sentence or the code fences, is ignored.</li>
    </ul>`);
  const ov = $('.overlay');
  ov.querySelector('[data-m="close"]').onclick = () => closeModal();
  ov.querySelector('[data-m="sample"]').onclick = () => { closeModal(); loadSample(); };
  ov.querySelector('[data-m="copy"]').onclick = async e => {
    const ok = await copyText(PROMPT);
    e.target.textContent = ok ? 'Copied ✓' : 'Copy failed';
    setTimeout(() => { e.target.textContent = 'Copy prompt'; }, 1800);
  };
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}

function loadSample() { startQuiz(addQuizFromText(JSON.stringify(SAMPLE), 'Sample')); }

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.closest('[data-id]')?.dataset.id;
  switch (b.dataset.act) {
    case 'home': if (view === 'quiz') exitQuiz(); else renderHome(); break;
    case 'guide': openGuide(); break;
    case 'account': openAccount(); break;
    case 'load-sample': loadSample(); break;
    case 'paste-toggle': {
      const p = $('#paste'); p.hidden = !p.hidden;
      if (!p.hidden) $('#pasteText').focus();
      break;
    }
    case 'paste-load': {
      const text = $('#pasteText').value;
      if (!text.trim()) return $('#pasteText').focus();
      try { const qid = addQuizFromText(text, 'Pasted quiz'); toast('Saved to library'); startQuiz(qid); }
      catch (err) { $('#pasteErr').textContent = err.message; }
      break;
    }
    case 'start': startQuiz(id); break;
    case 'history': openHistory.has(id) ? openHistory.delete(id) : openHistory.add(id); renderLibrary(); break;
    case 'delete': {
      const q = getQuiz(id);
      if (await confirmDialog(`Delete “${q.title}”?`, 'The quiz and its history will be removed from all your devices.', 'Delete')) {
        removeAll([id, ...attemptsOf(id).map(a => a.id)]);
        renderLibrary();
        toast('Quiz deleted');
      }
      break;
    }
    case 'del-attempt': removeAll([b.dataset.aid]); renderLibrary(); break;
    case 'pick': pickOption(+b.dataset.i); break;
    case 'check': checkShort(); break;
    case 'override': session.results[session.pos].correct = true; renderQuestion(); break;
    case 'next': next(); break;
    case 'exit': exitQuiz(); break;
    case 'retry': startQuiz(session.quizId); break;
    case 'retry-wrong': startQuiz(session.quizId, session.results.filter(r => !r.correct).map(r => r.qi)); break;
  }
});

document.addEventListener('keydown', e => {
  if ($('.overlay')) { if (e.key === 'Escape') closeModal(false); return; }
  if (view !== 'quiz' || !currentQuiz()) return;
  const q = currentQ(), answered = !!session.results[session.pos];
  if (e.key === 'Enter') {
    e.preventDefault();
    if (answered) next(); else if (q.type === 'short') checkShort();
    return;
  }
  if (e.key === 'Escape') return exitQuiz();
  if (e.target.matches('input, textarea') || answered || q.type !== 'mc' || e.ctrlKey || e.metaKey || e.altKey) return;
  let i = -1;
  if (/^[1-9]$/.test(e.key)) i = +e.key - 1;
  else if (/^[a-j]$/i.test(e.key)) i = LETTERS.indexOf(e.key.toUpperCase());
  if (i >= 0 && i < q.options.length) pickOption(i);
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

renderHome();
renderStatus();
sync();
</script>
</body>
</html>
